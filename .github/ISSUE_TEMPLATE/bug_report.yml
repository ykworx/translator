name: 버그 제보
description: 재현 순서와 사용 환경을 알려주세요.
title: "[버그] "
body:
  - type: markdown
    attributes:
      value: |
        먼저 같은 문제가 이미 등록되어 있는지 확인해주세요.
        이 이슈는 공개됩니다. API 키·토큰·개인정보·실제 음성 파일은 올리지 마세요.
        필요한 경우 민감정보를 제거한 오류 문구나 가상의 예시로 설명해주세요.
  - type: input
    id: app_version
    attributes:
      label: 앱 버전
      description: 릴리즈 버전이나 개발 중인 commit을 적어주세요. 확인하기 어렵다면 "모름"이라고 적어도 됩니다.
      placeholder: "예: v0.3.0 또는 개발 빌드"
    validations:
      required: true
  - type: input
    id: operating_system
    attributes:
      label: 운영체제와 기기 종류
      description: 운영체제 버전과 Apple Silicon·Intel 등 기기 종류를 알려주세요. 일련번호는 필요하지 않습니다.
      placeholder: "예: macOS 15.7, Apple Silicon"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 순서
      description: 어떤 기능에서 문제가 생기는지, 같은 현상을 확인할 수 있는 순서를 적어주세요.
      placeholder: |
        1. 설정에서 ...을 선택합니다.
        2. ...을 실행합니다.
        3. ... 상태에서 문제가 생깁니다.
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: 예상한 동작
      placeholder: 어떤 결과를 기대했나요?
    validations:
      required: true
  - type: textarea
    id: actual_behavior
    attributes:
      label: 실제 동작
      description: 오류 문구와 발생 빈도를 알면 함께 적어주세요.
      placeholder: 실제로 어떤 일이 일어났나요?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 관련 로그 또는 추가 설명 (선택)
      description: 민감정보를 제거한 관련 부분만 적어주세요. 로그나 파일 첨부는 필수가 아닙니다.
      render: text
    validations:
      required: false

