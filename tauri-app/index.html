<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/src/styles.css">
  <title>팝업 번역기</title>
</head>
<body>
  <!-- Titlebar drag region -->
  <div id="titlebar" data-tauri-drag-region>
    <span class="title">팝업 번역기</span>
  </div>

  <!-- Chat area -->
  <div id="chat"></div>

  <!-- Bottom area -->
  <div id="bottom-area">
    <div id="input-area">
      <textarea id="input-field" placeholder="번역할 내용을 입력하세요" rows="1"></textarea>
      <div id="input-toolbar">
        <div id="toolbar-left">
          <button id="btn-suggest" class="toolbar-btn" title="빠른 답장">💬 빠른 답장</button>
          <button id="btn-clear" class="toolbar-btn" title="초기화">🗑 초기화</button>
        </div>
        <div id="toolbar-right">
          <select id="lang-select">
            <option value="auto">🔄 자동 감지</option>
            <option value="한국어">한국어</option>
            <option value="日本語">日本語</option>
            <option value="English">English</option>
            <option value="中文(简体)">中文(简体)</option>
            <option value="中文(繁體)">中文(繁體)</option>
            <option value="Español">Español</option>
            <option value="Français">Français</option>
            <option value="Deutsch">Deutsch</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Settings modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <h3>설정</h3>
      <label>Gemini API Key</label>
      <input type="password" id="api-key-input" placeholder="API 키를 입력하세요...">
      <label>내 언어</label>
      <select id="my-lang-select">
        <option value="한국어">한국어</option>
        <option value="日本語">日本語</option>
        <option value="English">English</option>
        <option value="中文(简体)">中文(简体)</option>
        <option value="中文(繁體)">中文(繁體)</option>
        <option value="Español">Español</option>
        <option value="Français">Français</option>
        <option value="Deutsch">Deutsch</option>
      </select>
      <label>상대 언어 (자동 감지 시)</label>
      <select id="pair-lang-select">
        <option value="日本語">日本語</option>
        <option value="한국어">한국어</option>
        <option value="English">English</option>
        <option value="中文(简体)">中文(简体)</option>
        <option value="中文(繁體)">中文(繁體)</option>
        <option value="Español">Español</option>
        <option value="Français">Français</option>
        <option value="Deutsch">Deutsch</option>
      </select>
      <label>모델</label>
      <select id="model-select">
        <option value="gemini-2.0-flash">gemini-2.0-flash</option>
        <option value="gemini-2.0-flash-lite">gemini-2.0-flash-lite</option>
        <option value="gemini-2.5-flash">gemini-2.5-flash</option>
        <option value="gemini-2.5-pro">gemini-2.5-pro</option>
      </select>
      <div class="modal-actions">
        <button id="btn-save-settings">저장</button>
        <button id="btn-cancel-settings">취소</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
