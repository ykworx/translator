<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/src/styles.css">
  <title>팝업 번역기</title>
</head>
<body>
  <!-- Titlebar drag region -->
  <div id="titlebar" data-tauri-drag-region>
    <span class="title">팝업 번역기</span>
    <button id="btn-settings" type="button" class="toolbar-btn" aria-label="설정 열기" title="설정 열기 (⌘,)">⚙ 설정</button>
  </div>

  <!-- Chat area -->
  <div id="chat" role="log" aria-label="번역 기록" aria-live="polite"></div>

  <!-- Bottom area -->
  <div id="bottom-area">
    <div id="input-area">
      <textarea id="input-field" aria-label="번역할 내용 입력" aria-describedby="input-hint" placeholder="번역할 내용을 입력하세요" rows="1"></textarea>
      <div id="input-toolbar">
        <div id="toolbar-left">
          <button id="btn-mic" class="toolbar-btn" title="음성 입력">🎙 음성</button>
          <button id="btn-zoom-captions" class="toolbar-btn hidden" title="선택 앱 실시간 번역">🖥 자막</button>
          <span class="toolbar-sep"></span>
          <button id="btn-handwriting" class="toolbar-btn" title="필기 인식">✏️ 필기</button>
          <button id="btn-suggest" class="toolbar-btn" title="빠른 답장 생성">💬 답장</button>
          <button id="btn-summarize" class="toolbar-btn" title="내용 요약">📋 요약</button>
          <span class="toolbar-sep"></span>
          <button id="btn-clear" class="toolbar-btn" title="대화 초기화" aria-label="대화 초기화">🗑</button>
        </div>
        <div id="toolbar-right">
          <select id="lang-select" aria-label="번역 대상 언어">
            <option value="auto">🔄 자동 감지</option>
          </select>
        </div>
      </div>
      <div id="input-footer">
        <span id="input-hint">Enter로 번역 · Shift+Enter로 줄바꿈</span>
        <button id="btn-translate" type="button" aria-busy="false" disabled>번역</button>
      </div>
      <div id="settings-access-status" role="status" aria-live="polite"></div>
      <div id="speech-status" aria-live="polite"></div>
      <div id="zoom-status" aria-live="polite"></div>
    </div>
  </div>

  <!-- Handwriting panel -->
  <div id="handwriting-panel" class="hidden">
    <div id="hw-header">
      <span class="hw-title">필기 인식</span>
      <div class="hw-mode-tabs">
        <button class="hw-mode-btn active" data-mode="kanji">漢字</button>
        <button class="hw-mode-btn" data-mode="kana">かな</button>
      </div>
      <div class="hw-actions">
        <button id="hw-recognize" class="hw-btn">인식</button>
        <button id="hw-clear" class="hw-btn">지우기</button>
        <button id="hw-close" class="hw-btn" aria-label="필기 인식 닫기">✕</button>
      </div>
    </div>
    <div id="hw-canvas-wrap">
      <canvas id="handwriting-canvas"></canvas>
    </div>
    <div id="handwriting-result">
      <div class="hw-placeholder">글자를 그려주세요</div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
